name: Fork nightly

# Bryce's fork: merge upstream into bryce/main, check the fork's own features, build the
# Linux x64 and macOS arm64 CLI archives plus the macOS arm64 app, and publish a GitHub
# release that bryceflow's update mirror copies. Any failure publishes nothing, and
# bryce/main only moves after a release is published. See docs/fork/updates.md.

on:
  schedule:
    # 03:20 Pacific (standard time). Avoids minute zero, when GitHub schedules are busiest.
    - cron: "20 11 * * *"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Fork branch to merge upstream into and build (the fix agent uses fork-fix/* branches)
        required: false
        default: bryce/main
        type: string
      force:
        description: Build even if nothing changed since the last fork release
        required: false
        default: false
        type: boolean

concurrency:
  group: fork-nightly
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    name: Merge upstream
    if: github.repository == 'brytay04/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.merge.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REF: ${{ inputs.source_ref || 'bryce/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || 'bryce/main' }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Merge upstream/main
        id: merge
        run: |
          set -euo pipefail
          git config user.name "fork-nightly[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --quiet upstream main '+refs/tags/*:refs/upstream-tags/*'
          if ! git merge --no-edit -m "Merge upstream/main into $SOURCE_REF" upstream/main; then
            echo "::error::upstream/main does not merge cleanly into $SOURCE_REF:"
            git diff --name-only --diff-filter=U | sed 's/^/  /'
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: version
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          latest_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [[ "$FORCE" != "true" && -n "$latest_tag" ]] \
            && git fetch --quiet origin "refs/tags/$latest_tag:refs/tags/$latest_tag" \
            && [[ "$(git rev-parse "$latest_tag^{tree}")" == "$(git rev-parse 'HEAD^{tree}')" ]]; then
            echo "Nothing changed since $latest_tag; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(./fork/resolve-version.sh)"
          echo "Fork version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # Later jobs fetch the merge commit by SHA, so it must be reachable from a branch.
      - name: Push candidate branch
        if: steps.version.outputs.skip != 'true'
        run: git push --force origin HEAD:refs/heads/fork-nightly/candidate

  checks:
    name: Fork checks
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --quiet upstream main

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Typecheck, lint and test the fork's changes
        run: ./fork/run-fork-checks.sh upstream/main

  build_bundle:
    name: Build JS bundle
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Load public T3 Connect config
        run: grep -E '^T3CODE_(CLERK_PUBLISHABLE_KEY|CLERK_JWT_TEMPLATE|CLERK_CLI_OAUTH_CLIENT_ID|RELAY_URL)=' .env.example >> "$GITHUB_ENV"

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.prepare.outputs.version }}"

      - name: Build JS bundle
        run: vp run build:desktop:bundle

      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  public_config:
    name: Read public T3 Connect config
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      clerk_publishable_key: ${{ steps.config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.config.outputs.relay_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          sparse-checkout: .env.example
      - id: config
        run: |
          value() { sed -n "s|^T3CODE_$1=||p" .env.example; }
          {
            echo "clerk_publishable_key=$(value CLERK_PUBLISHABLE_KEY)"
            echo "clerk_jwt_template=$(value CLERK_JWT_TEMPLATE)"
            echo "clerk_cli_oauth_client_id=$(value CLERK_CLI_OAUTH_CLIENT_ID)"
            echo "relay_url=$(value RELAY_URL)"
          } >> "$GITHUB_OUTPUT"

  desktop_linux_x64:
    name: Linux x64
    needs: [prepare, build_bundle, public_config]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.public_config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.public_config.outputs.relay_url }}
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true

  desktop_mac_arm64:
    name: macOS arm64
    needs: [prepare, build_bundle, public_config]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.public_config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.public_config.outputs.relay_url }}
      label: macOS arm64
      runner: macos-15
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true

  release:
    name: Publish fork release
    needs: [prepare, checks, desktop_linux_x64, desktop_mac_arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SHA: ${{ needs.prepare.outputs.sha }}
      SOURCE_REF: ${{ inputs.source_ref || 'bryce/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          sparse-checkout: fork

      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download CLI archives
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      - name: Check assets and write checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          rm -f builder-debug.yml
          for required in "t3-$VERSION-linux-x64.tar.gz" "t3-$VERSION-darwin-arm64.tar.gz" nightly-mac.yml nightly-linux.yml; do
            [[ -f "$required" ]] || { echo "::error::Missing $required"; ls -la; exit 1; }
          done
          grep -q "^version: $VERSION\$" nightly-mac.yml
          grep -q "^version: $VERSION\$" nightly-linux.yml
          ls -la
          sha256sum t3-*.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        run: |
          set -euo pipefail
          {
            echo "Fork build of [\`$SOURCE_REF\`](https://github.com/$GITHUB_REPOSITORY/tree/$SOURCE_REF) merged with upstream at \`${SHA:0:10}\`."
            echo
            echo "Installed by bryceflow's update mirror. See docs/fork/updates.md."
          } > notes.md
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "T3 Code fork v$VERSION" \
            --notes-file notes.md \
            --prerelease \
            release-assets/*

      # Fast-forward only: if Bryce pushed meanwhile, tomorrow's run merges again.
      - name: Move bryce/main to the released commit
        run: |
          if git push origin "$SHA:refs/heads/bryce/main"; then
            echo "bryce/main is now ${SHA:0:10}."
          else
            echo "::warning::bryce/main moved during the build; it was not updated."
          fi
